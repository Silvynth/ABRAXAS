<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f17"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#222436" stroke-width="6"/>

  <!-- Glowing Abraxas Hexagram / Diamond Cross Symbol (❖) -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Central Rhombus -->
    <polygon points="0,-160 160,0 0,160 -160,0" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linejoin="round"/>
    
    <!-- Inner Rotated Cross -->
    <polygon points="0,-90 90,0 0,90 -90,0" fill="url(#accentGrad)" opacity="0.25"/>
    
    <!-- Inner Diamonds / Core Points -->
    <circle cx="0" cy="0" r="28" fill="url(#cyanGrad)"/>
    <circle cx="0" cy="-160" r="14" fill="#38bdf8"/>
    <circle cx="160" cy="0" r="14" fill="#a855f7"/>
    <circle cx="0" cy="160" r="14" fill="#38bdf8"/>
    <circle cx="-160" cy="0" r="14" fill="#a855f7"/>

    <!-- Orbital Line Accents -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="14 10" opacity="0.6"/>
  </g>
</svg>

